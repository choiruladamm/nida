name: Nida CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify toolchain
        run: |
          xcodebuild -version
          xcodebuild -version | head -1 | grep -Fx 'Xcode 27.0'
      - name: Release workflow regression tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Swift tests
        run: make test
      - name: Release build
        run: make build CONFIGURATION=Release
